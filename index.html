<script>
const ENDPOINT = 'https://formspree.io/f/mqpebzlq';
const SAMPLES = [
  { chip: 'Co-op roguelike', idea: 'A 4-player co-op roguelike with crafting and online play. Team of 2, 12 months.' },
  { chip: 'Cozy farming sim', idea: 'A cozy farming sim with seasons, villagers and gifting. Solo developer, 9 months.' },
  { chip: 'Open-world RPG', idea: 'An open-world action RPG with quests, skill trees and a day-night cycle. Solo developer, 12 months.' }
];
const COLORS = { 'LOW': ['#9BE7B5', '#16241C', '#2E5A3E'], 'MEDIUM': ['#FFD08A', '#2A2216', '#6B5A2E'], 'HIGH': ['#FFB4A8', '#2A1B1F', '#6B3A3A'], 'VERY HIGH': ['#FFB4A8', '#2A1B1F', '#6B3A3A'], 'UNKNOWN': ['#C9C6D4', '#121117', '#26232F'] };
const NOTE = 'Quick rule-based estimate from the keywords in your text. The full AI analysis runs in the Veta app.';
const ACC = '#6C47FF';
const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

/* ANALYZE-FN */
function analyzeIdea(text) {
const t = String(text || '').toLowerCase();
const words = (t.match(/[a-z0-9']+/g) || []).length;
const has = (list) => list.some((k) => t.includes(k));
const defs = [
{ key: 'multiplayer', name: 'Online multiplayer', days: 12, kw: ['multiplayer', 'co-op', 'coop', 'online', 'pvp', 'lobby', 'matchmaking'] },
{ key: 'openworld', name: 'Open world', days: 20, kw: ['open world', 'open-world', 'huge map', 'sandbox world', 'massive world'] },
{ key: 'combat', name: 'Combat', days: 10, kw: ['combat', 'fight', 'boss', 'weapon', 'shooter', 'shoot', 'action'] },
{ key: 'procedural', name: 'Procedural levels', days: 8, kw: ['procedural', 'roguelike', 'roguelite', 'randomly generated', 'random levels'] },
{ key: 'crafting', name: 'Crafting', days: 8, kw: ['craft'] },
{ key: 'building', name: 'Base building', days: 8, kw: ['base building', 'base-building', 'building system', 'construction', 'city builder'] },
{ key: 'quests', name: 'Quests and story', days: 8, kw: ['quest', 'story', 'narrative', 'cutscene'] },
{ key: 'dialogue', name: 'Characters and dialogue', days: 7, kw: ['dialogue', 'villager', 'npc', 'companion', 'romance'] },
{ key: 'progression', name: 'Progression', days: 6, kw: ['skill tree', 'progression', 'level up', 'talent', 'upgrade'] },
{ key: 'inventory', name: 'Inventory and items', days: 5, kw: ['inventory', 'loot', 'equipment', 'items'] },
{ key: 'enemies', name: 'Enemy AI', days: 6, kw: ['enemy', 'enemies'] },
{ key: 'economy', name: 'Economy and shop', days: 5, kw: ['shop', 'economy', 'trading', 'currency'] },
{ key: 'farming', name: 'Farming and seasons', days: 7, kw: ['farm', 'season', 'survival', 'hunger'] },
{ key: 'world', name: 'Day-night cycle', days: 4, kw: ['day-night', 'day night', 'weather'] },
{ key: 'vehicles', name: 'Vehicles', days: 8, kw: ['racing', 'vehicle', 'drift', 'driving'] },
{ key: 'puzzle', name: 'Puzzle logic', days: 5, kw: ['puzzle'] },
{ key: 'physics', name: 'Physics', days: 5, kw: ['physics', 'ragdoll'] }
];
const found = defs.filter((d) => has(d.kw));
const major = found.length;
let team = null;
let m = t.match(/team of (\d+)/) || t.match(/(\d+)[- ]?(?:person|people|devs|developers|members)/) || t.match(/(\d+) of us/);
if (m) { team = Math.max(1, parseInt(m[1], 10)); }
else if (/\b(solo|alone|by myself|one developer|single developer|one person)\b/.test(t)) { team = 1; }
let months = null;
m = t.match(/(\d+(?:\.\d+)?)\s*(months?|mos?|weeks?|years?)/);
if (m) {
const n = parseFloat(m[1]);
months = /^y/.test(m[2]) ? n * 12 : /^w/.test(m[2]) ? n / 4.3 : n;
}
const teamN = team === null ? 1 : team;
const monthsN = months === null ? 12 : Math.max(0.5, months);
const teamEff = 1 + (teamN - 1) * 0.7;
const tasks = [{ name: 'Player controller and camera', days: 4 }]
.concat(found.map((d) => ({ name: d.name, days: d.days })))
.concat([{ name: 'Menus and UI', days: 5 }, { name: 'Save and load', days: 3 }]);
const buildDays = tasks.reduce((s, x) => s + x.days, 0);
const ratio = (buildDays * 2.5) / (monthsN * 20 * teamEff * 0.6);
const clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, v));
const half = (v) => Math.round(v * 2) / 2;
const readiness = half(clamp(10 - 9 * ratio, 1, 9.5));
let q = 3;
if (words >= 15) { q += 1; }
if (words >= 40) { q += 1; }
if (words >= 80) { q += 1; }
if (team !== null && months !== null) { q += 1; }
q += Math.min(2, major * 0.5);
if (has(['loop', 'goal', 'objective', 'survive', 'defeat', 'collect', 'escape'])) { q += 0.5; }
const quality = half(clamp(q, 2, 9));
const risks = [];
if (major / teamN >= 3) { risks.push(major + ' major systems for ' + (teamN === 1 ? 'a solo developer' : 'a team of ' + teamN)); }
if (found.some((d) => d.key === 'multiplayer')) { risks.push(teamN === 1 ? 'Online multiplayer is very heavy for a solo developer' : 'Online multiplayer adds networking and testing work'); }
if (found.some((d) => d.key === 'openworld')) { risks.push('Open worlds need content at scale'); }
if (found.filter((d) => ['quests', 'dialogue', 'procedural', 'openworld'].includes(d.key)).length >= 2) { risks.push('High content requirement: levels, quests or dialogue'); }
if (major >= 4) { risks.push('Many interconnected systems'); }
if (ratio > 1) { risks.push('Estimated effort is larger than your timeline'); }
else if (ratio > 0.55) { risks.push('The timeline is tight for this scope'); }
const assumed = [];
if (team === null) { assumed.push('a solo developer'); }
if (months === null) { assumed.push('12 months'); }
if (assumed.length) { risks.push('Not mentioned, so Veta assumed ' + assumed.join(' and ')); }
if (major === 0) { risks.push('No major systems detected. Try describing mechanics like combat, crafting or multiplayer'); }
if (words < 10) { risks.push('The description is very short, so this analysis is rough'); }
if (!risks.length) { risks.push('No major risks found in this description'); }
const level = major === 0 ? 'UNKNOWN' : ratio > 1 ? 'VERY HIGH' : ratio > 0.55 ? 'HIGH' : ratio > 0.3 ? 'MEDIUM' : 'LOW';
const cands = [
{ key: 'multiplayer', request: 'Add online co-op', touches: 'networking, save data, UI and testing', days: 12 },
{ key: 'crafting', request: 'Add a crafting system', touches: 'inventory, UI and save data', days: 8 },
{ key: 'building', request: 'Add base building', touches: 'world state, save data and UI', days: 8 },
{ key: 'progression', request: 'Add a skill tree', touches: 'progression, UI and balancing', days: 6 },
{ key: 'procedural', request: 'Add procedural levels', touches: 'level design, save data and testing', days: 8 },
{ key: 'combat', request: 'Add boss fights', touches: 'combat, enemy AI and animation', days: 8 }
];
const cand = cands.find((c) => !found.some((d) => d.key === c.key)) || cands[0];
const buildMonths = ratio * monthsN;
const fmtM = (v) => (Math.round(v * 10) / 10).toString().replace(/\.0$/, '');
const biggest = found.slice().sort((a, b) => b.days - a.days)[0] || null;
let verdict;
if (major === 0) { verdict = 'Not enough detail to judge the scope yet. Describe the mechanics and the team.'; }
else if (ratio > 1) { verdict = 'About ' + fmtM(buildMonths) + ' months of work for a ' + fmtM(monthsN) + '-month window. This will not ship as written.'; }
else if (ratio > 0.55) { verdict = 'About ' + fmtM(buildMonths) + ' months of work in ' + fmtM(monthsN) + '. It can ship, but there is almost no buffer.'; }
else if (ratio > 0.3) { verdict = 'About ' + fmtM(buildMonths) + ' months of work in ' + fmtM(monthsN) + '. Reasonable, keep an eye on new features.'; }
else { verdict = 'About ' + fmtM(buildMonths) + ' months of work in ' + fmtM(monthsN) + '. Comfortable scope.'; }
const cut = biggest && ratio > 0.3 ? 'Park "' + biggest.name + '" (about ' + biggest.days + ' days) for after launch.' : '';
const shareText = 'Veta report card\nGDD quality ' + quality + '/10 · Production readiness ' + readiness + '/10 · Scope risk ' + level + '\n' + verdict + (cut ? '\n' + cut : '') + '\nMade with Veta, the Game Studio OS.';
const weeks = Math.max(1, Math.round((cand.days * 2.5) / (5 * teamEff)));
return {
idea: String(text || '').trim(),
systems: (found.length ? found.map((d) => d.name) : ['Core loop not described']).map((s) => ({ text: s })),
quality: String(quality),
readiness: String(readiness),
qPct: Math.round(quality * 10) + '%',
rPct: Math.round(readiness * 10) + '%',
risks: risks.map((r) => ({ text: r })),
riskLevel: level,
tasks: tasks.map((x) => ({ name: x.name, est: x.days + 'd' })),
totalDays: buildDays + ' working days (one developer, rough)',
scope: { request: cand.request, touches: cand.touches, delta: '+' + weeks + (weeks === 1 ? ' week' : ' weeks') },
verdict: verdict,
cut: cut,
shareText: shareText,
rawQuality: quality,
rawReadiness: readiness
};
}

/* /ANALYZE-FN */

const state = { input: SAMPLES[0].idea, result: null, tab: 'report', wl: { msg: '', color: '#A59FBB' }, clear: false, shareMsg: '' };
state.result = analyzeIdea(state.input);

function view() {
  const r = state.result;
  const col = COLORS[r.riskLevel];
  const cur = Object.assign({}, r, { name: 'your game', riskFg: col[0], riskBg: col[1], riskBd: col[2], note: NOTE });
  const chips = SAMPLES.map(x => { const on = state.input.trim() === x.idea; return { label: x.chip, bg: on ? '#EEEDF2' : '#121117', fg: on ? '#0B0A10' : '#B4B0C2', bd: on ? '#EEEDF2' : '#26232F' }; });
  const tabs = [['report', 'Report card'], ['tasks', 'Task breakdown'], ['scope', 'Scope Guard']].map(d => { const on = state.tab === d[0]; return { key: d[0], label: d[1], bg: on ? '#1C1A24' : 'transparent', fg: on ? '#FFFFFF' : '#8E8A9B', bd: on ? '#2E2A3A' : 'transparent' }; });
  const isReport = state.tab === 'report', isTasks = state.tab === 'tasks', isScope = state.tab === 'scope';
  const wl = state.wl;
  const input = { value: esc(state.input) };
  const busy = false, aiMsg = esc(state.aiMsg || ''), analyzeLabel = 'Analyze';
  const demoUrl = 'app.html', demoTarget = '_self';
  return `

<div style="background:#09080D;color:#EEEDF2;font-family:'Geist',system-ui,sans-serif;width:100%;overflow-x:clip">

<a href="#top" style="display:flex;align-items:center;gap:10px;color:#FFFFFF">
<svg width="24" height="24" viewBox="0 0 44 44" aria-hidden="true"><path d="M3 7 Q9 4 12 11 L21 31 L32 7 Q34.500 2 41 3 Q36 5.500 34 11 L25 37 Q21.500 45 17 37 Z" fill="#FFFFFF"/></svg>
<span style="font-family:'Bricolage Grotesque',sans-serif;font-weight:700;font-size:21px;letter-spacing:-0.5px;color:#FFFFFF">veta</span>
</a>

</div>

<!-- HERO -->

</g>

</div>
<div aria-hidden="true" style="position:absolute;left:0;right:0;bottom:0;height:520px;pointer-events:none;background:radial-gradient(ellipse 60% 70% at 50% 100%,rgba(108,71,255,0.22),rgba(9,8,13,0) 70%)"></div>

<div style="position:relative;max-width:900px;margin:0 auto;padding:150px 24px 0;box-sizing:border-box;display:flex;flex-direction:column;gap:24px;align-items:center;text-align:center" class="hero-wrap">

<p class="hero-sub" style="margin:0;font-size:19px;line-height:1.6;color:#8E8A9B;max-width:620px">Veta reads your game design, scores how ready it is to build, breaks it into estimated tasks, and warns you before scope creep costs you weeks.</p>

` : ''}

${isReport ? `
<div style="display:flex;flex-direction:column;gap:18px">
<div style="font-size:17px;line-height:1.5;color:#FFFFFF;font-weight:500;letter-spacing:-0.2px">${esc(cur.verdict)}</div>

<summary style="display:flex;justify-content:space-between;align-items:center;gap:16px;padding:22px 0;font-size:16px;font-weight:500;color:#EEEDF2">Can I use Veta today?<span class="faq-plus" style="flex:none;font-size:22px;line-height:1;color:#8E8A9B;transition:transform 0.2s">+</span></summary>
<p style="margin:0 0 22px;font-size:15px;line-height:1.6;color:#8E8A9B;max-width:620px">Not yet. Veta launches in early 2027. People on the waitlist get early access first. You can already try the working demo, with producer chat, a task board and Scope Guard.</p>
</details>
<details style="border-bottom:1px solid #22202B">
<summary style="display:flex;justify-content:space-between;align-items:center;gap:16px;padding:22px 0;font-size:16px;font-weight:500;color:#EEEDF2">What happens to my game ideas?<span class="faq-plus" style="flex:none;font-size:22px;line-height:1;color:#8E8A9B;transition:transform 0.2s">+</span></summary>
<p style="margin:0 0 22px;font-size:15px;line-height:1.6;color:#8E8A9B;max-width:620px">In this prototype, your text is sent to the AI only to produce your analysis, and Veta does not save it. A full data policy, covering what is stored and how it is used, will be published before launch.</p>
</details>
<details style="border-bottom:1px solid #22202B">
<summary style="display:flex;justify-content:space-between;align-items:center;gap:16px;padding:22px 0;font-size:16px;font-weight:500;color:#EEEDF2">Which game engines does it work with?<span class="faq-plus" style="flex:none;font-size:22px;line-height:1;color:#8E8A9B;transition:transform 0.2s">+</span></summary>
<p style="margin:0 0 22px;font-size:15px;line-height:1.6;color:#8E8A9B;max-width:620px">Any. Veta plans from your design document, so the engine doesn't matter. Importing existing Unity and Godot projects is on the roadmap.</p>
</details>
<details style="border-bottom:1px solid #22202B">
<summary style="display:flex;justify-content:space-between;align-items:center;gap:16px;padding:22px 0;font-size:16px;font-weight:500;color:#EEEDF2">What is a credit?<span class="faq-plus" style="flex:none;font-size:22px;line-height:1;color:#8E8A9B;transition:transform 0.2s">+</span></summary>
<p style="margin:0 0 22px;font-size:15px;line-height:1.6;color:#8E8A9B;max-width:620px">Credits are used when Veta analyzes a GDD. The free plan includes 9, Pro includes 40 a month, and Studio is unlimited under fair use.</p>
</details>
<details style="border-bottom:1px solid #22202B">
<summary style="display:flex;justify-content:space-between;align-items:center;gap:16px;padding:22px 0;font-size:16px;font-weight:500;color:#EEEDF2">Is this only for solo developers?<span class="faq-plus" style="flex:none;font-size:22px;line-height:1;color:#8E8A9B;transition:transform 0.2s">+</span></summary>
<p style="margin:0 0 22px;font-size:15px;line-height:1.6;color:#8E8A9B;max-width:620px">No. The launch features work the same for solo developers and small teams. Team features like a dependency map and a shared decision log come later.</p>
</details>
<details style="border-bottom:1px solid #22202B">
<summary style="display:flex;justify-content:space-between;align-items:center;gap:16px;padding:22px 0;font-size:16px;font-weight:500;color:#EEEDF2">Who is building Veta?<span class="faq-plus" style="flex:none;font-size:22px;line-height:1;color:#8E8A9B;transition:transform 0.2s">+</span></summary>

function render() {
  const app = document.getElementById('app');
  const em = document.getElementById('email');
  let val = em ? em.value : '';
  const focused = em && document.activeElement === em;
  if (state.clear) { val = ''; state.clear = false; }
  const y = window.scrollY;
  app.innerHTML = view();
  const em2 = document.getElementById('email');
  if (em2) { em2.value = val; if (focused) em2.focus(); }
  window.scrollTo({ top: y, behavior: 'instant' });
}

document.addEventListener('input', e => {
  if (e.target.id === 'idea-input') state.input = e.target.value;
});

document.addEventListener('click', e => {
  const c = e.target.closest('[data-game]');
  if (c) { const s = SAMPLES[+c.dataset.game]; state.input = s.idea; state.result = analyzeIdea(s.idea); state.shareMsg = ''; render(); return; }
  const t = e.target.closest('[data-tab]');
  if (t) { state.tab = t.dataset.tab; render(); return; }
  const sh = e.target.closest('[data-share]');
  if (sh) {
    const r = state.result;
    if (sh.dataset.share === 'copy') {
      const done = () => { state.shareMsg = 'Summary copied.'; render(); };
      const fail = () => { state.shareMsg = 'Could not copy. Select the text from the report instead.'; render(); };
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(r.shareText).then(done, fail); else fail();
      return;
    }
    state.shareMsg = 'Building your card...'; render();
    drawCard(r).then(async (blob) => {
      if (!blob) { state.shareMsg = 'Could not build the card in this browser.'; render(); return; }
      try {
        const file = new File([blob], 'veta-report-card.png', { type: 'image/png' });
        if (navigator.canShare && navigator.canShare({ files: [file] }) && /Mobi|Android/i.test(navigator.userAgent)) {
          await navigator.share({ files: [file], text: r.shareText }); state.shareMsg = 'Shared.'; render(); return;
        }
      } catch (err) { if (err && err.name === 'AbortError') { state.shareMsg = ''; render(); return; } }
      const url = URL.createObjectURL(blob); const a = document.createElement('a');
      a.href = url; a.download = 'veta-report-card.png'; document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 4000);
      state.shareMsg = 'Card saved as PNG.'; render();
    });
    return;
  }
  const a = e.target.closest('[data-analyze]');
  if (a) {
    e.preventDefault();
    const el = document.getElementById('idea-input');
    if (el) state.input = el.value;
    state.aiMsg = state.input.trim() ? '' : 'Write a short description of your game first.';
    if (state.input.trim()) { state.result = analyzeIdea(state.input); state.shareMsg = ''; }
    render();
    const demo = document.getElementById('product');
    if (demo) demo.scrollIntoView({ behavior: 'smooth' });
  }
});

function wrapText(ctx, text, x, y, maxW, lineH, maxLines) {
  const words = String(text).split(/\s+/); let line = ''; let n = 0;
  for (let i = 0; i < words.length; i++) {
    const test = line ? line + ' ' + words[i] : words[i];
    if (ctx.measureText(test).width > maxW && line) {
      n++; if (n >= maxLines) { ctx.fillText(line.replace(/[ ,.;:]*$/, '') + '...', x, y); return y + lineH; }
      ctx.fillText(line, x, y); y += lineH; line = words[i];
    } else { line = test; }
  }
  if (line) { ctx.fillText(line, x, y); y += lineH; }
  return y;
}
async function drawCard(r) {
  try { if (document.fonts && document.fonts.ready) await document.fonts.ready; } catch (e) {}
  const W = 1200, H = 630, c = document.createElement('canvas'); c.width = W; c.height = H;
  const x = c.getContext('2d'); const F = "Geist, system-ui, -apple-system, 'Segoe UI', sans-serif";
  x.fillStyle = '#09080D'; x.fillRect(0, 0, W, H);
  const g = x.createRadialGradient(W * 0.85, H * 1.1, 20, W * 0.85, H * 1.1, 620);
  g.addColorStop(0, 'rgba(108,71,255,0.55)'); g.addColorStop(1, 'rgba(108,71,255,0)'); x.fillStyle = g; x.fillRect(0, 0, W, H);
  x.strokeStyle = '#2A2540'; x.lineWidth = 2; x.strokeRect(24, 24, W - 48, H - 48);
  // logo
  x.save(); x.translate(64, 62); x.scale(1, 1); x.fillStyle = '#FFFFFF'; x.scale(1.1, 1.1);
  x.fill(new Path2D('M3 7 Q9 4 12 11 L21 31 L32 7 Q34.500 2 41 3 Q36 5.500 34 11 L25 37 Q21.500 45 17 37 Z')); x.restore();
  x.fillStyle = '#FFFFFF'; x.font = '700 34px ' + F; x.textBaseline = 'alphabetic'; x.fillText('veta', 124, 100);
  x.fillStyle = '#8E8A9B'; x.font = '500 16px ' + F; x.fillText('GAME REPORT CARD', W - 64 - x.measureText('GAME REPORT CARD').width, 98);
  // idea
  x.fillStyle = '#C9C6D4'; x.font = '400 24px ' + F; wrapText(x, r.idea, 64, 170, 700, 34, 3);
  // scores
  const box = (bx, label, val, col) => {
    x.fillStyle = '#121117'; x.strokeStyle = '#26232F'; x.lineWidth = 2;
    x.beginPath(); x.roundRect(bx, 270, 270, 150, 18); x.fill(); x.stroke();
    x.fillStyle = '#8E8A9B'; x.font = '500 18px ' + F; x.fillText(label, bx + 24, 306);
    x.fillStyle = '#FFFFFF'; x.font = '600 70px ' + F; x.fillText(val, bx + 24, 382);
    const vw = x.measureText(val).width; x.fillStyle = '#8E8A9B'; x.font = '400 26px ' + F; x.fillText('/10', bx + 24 + vw + 6, 382);
    x.fillStyle = '#22202B'; x.fillRect(bx + 24, 398, 222, 6); x.fillStyle = col; x.fillRect(bx + 24, 398, 222 * (parseFloat(val) / 10), 6);
  };
  box(64, 'GDD quality', r.quality, '#B7A6FF'); box(354, 'Production readiness', r.readiness, '#FFB454');
  // risk pill
  const col = COLORS[r.riskLevel] || COLORS.UNKNOWN;
  x.fillStyle = col[1]; x.strokeStyle = col[2]; x.beginPath(); x.roundRect(64, 446, 560, 64, 16); x.fill(); x.stroke();
  x.fillStyle = '#EEEDF2'; x.font = '500 22px ' + F; x.fillText('Overall scope risk', 88, 487);
  x.fillStyle = col[0]; x.font = '600 24px ' + F; const lv = r.riskLevel; x.fillText(lv, 600 - x.measureText(lv).width, 487);
  // right column: risks
  x.fillStyle = '#8E8A9B'; x.font = '500 15px ' + F; x.fillText('TOP RISKS', 790, 306);
  x.fillStyle = '#E5E2EE'; x.font = '400 22px ' + F; let y = 342;
  r.risks.slice(0, 3).forEach((k) => { x.fillStyle = '#FFB454'; x.beginPath(); x.arc(796, y - 7, 5, 0, 7); x.fill(); x.fillStyle = '#E5E2EE'; y = wrapText(x, k.text, 814, y, 330, 30, 3) + 12; });
  // verdict
  x.fillStyle = '#FFFFFF'; x.font = '500 22px ' + F; wrapText(x, r.verdict, 64, 552, 1070, 30, 2);
  x.fillStyle = '#8E8A9B'; x.font = '400 16px ' + F; x.fillText('Made with Veta · Game Studio OS', W - 64 - x.measureText('Made with Veta · Game Studio OS').width, 596);
  return new Promise((res) => c.toBlob(res, 'image/png'));
}

document.addEventListener('submit', async e => {
  if (e.target.id !== 'wl-form') return;
  if (e.target.dataset.native === '1') return; // fallback: let the browser post the form normally
  e.preventDefault();
  const form = e.target;
  const email = String(form.elements.email.value || '').trim();
  const say = (msg, color, clear) => { state.wl = { msg, color }; state.clear = !!clear; render(); };
  // Fallback that always works: a normal form post to Formspree (opens their thank-you page).
  const nativePost = () => {
    const f = document.createElement('form');
    f.method = 'POST'; f.action = ENDPOINT; f.dataset.native = '1'; f.style.display = 'none';
    [['email', email], ['source', 'veta-landing']].forEach(([k, v]) => { const i = document.createElement('input'); i.type = 'hidden'; i.name = k; i.value = v; f.appendChild(i); });
    document.body.appendChild(f); f.submit();
  };
  say('Sending...', '#A59FBB');
  try {
    const res = await fetch(ENDPOINT, { method: 'POST', headers: { 'Accept': 'application/json' }, body: new URLSearchParams({ email, source: 'veta-landing' }) });
    if (res.ok) { say("You're on the list. We'll email you when Veta opens.", '#9BE7B5', true); return; }
    let detail = '';
    try { const j = await res.json(); detail = (j.errors && j.errors.map(x => x.message).join(' ')) || j.error || ''; } catch (_) {}
    console.warn('Formspree error', res.status, detail);
    if (res.status === 422 && /email/i.test(detail)) { say('That email address looks invalid. Please check it.', '#FFB4A8'); return; }
    say('Finishing on Formspree...', '#A59FBB'); nativePost();
  } catch (err) {
    console.warn('Formspree network error', err);
    say('Finishing on Formspree...', '#A59FBB'); nativePost();
  }
});

render();
