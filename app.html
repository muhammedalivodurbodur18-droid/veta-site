<body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@700&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap">
<style>
/* Layout: fixed left rail (project + tools) and one working surface; a dark production console, single committed look. */
:root{
  --bg:#09080D; --surface:#0E0D13; --raised:#121117; --hover:#17151E;
  --line:#22202B; --line-strong:#2E2A3A;
  --text:#EEEDF2; --muted:#8E8A9B; --soft:#C9C6D4;
  --accent:#6C47FF; --accent-soft:#B7A6FF; --accent-wash:rgba(108,71,255,.12);
  --ok:#9BE7B5; --ok-wash:#16241C; --ok-line:#2E5A3E;
  --warn:#FFD08A; --warn-wash:#2A2216; --warn-line:#6B5A2E;
  --bad:#FFB4A8; --bad-wash:#2A1B1F; --bad-line:#5A3434;
  --font-display:'Bricolage Grotesque',Georgia,serif;
  --font-body:'Geist',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif;
  --font-mono:'Geist Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  --r:12px; --r-s:8px;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font-family:var(--font-body);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--accent-soft)}
:focus-visible{outline:2px solid var(--accent-soft);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

#app{display:flex;height:100%;min-height:0}

/* rail */
.rail{width:248px;flex:none;background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.rail-top{padding:18px 16px 14px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line)}
.wordmark{font-family:var(--font-display);font-weight:700;font-size:21px;letter-spacing:-.5px;color:#fff}
.chip{font-family:var(--font-mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);border:1px solid var(--line-strong);border-radius:6px;padding:2px 6px}
.chip.example{color:var(--warn);border-color:var(--warn-line);background:var(--warn-wash)}
.rail-section{padding:14px 16px 6px}
.label{font-family:var(--font-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.proj-row{display:flex;gap:6px;margin-top:8px}
.proj-row select{flex:1;min-width:0;background:var(--raised);border:1px solid var(--line-strong);border-radius:var(--r-s);padding:8px 10px}
.icon-btn{flex:none;width:36px;height:36px;display:grid;place-items:center;background:var(--raised);border:1px solid var(--line-strong);border-radius:var(--r-s);color:var(--soft)}
.icon-btn:hover{background:var(--hover);color:#fff}
.nav{display:flex;flex-direction:column;gap:2px;padding:8px}
.nav button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:transparent;border:1px solid transparent;border-radius:var(--r-s);padding:9px 10px;color:var(--soft);font-weight:500}
.nav button:hover{background:var(--hover);color:#fff}
.nav button[aria-current="page"]{background:var(--raised);border-color:var(--line-strong);color:#fff}
.nav svg{flex:none;color:var(--muted)}
.nav button[aria-current="page"] svg{color:var(--accent-soft)}
.nav .count{margin-left:auto;font-family:var(--font-mono);font-size:11px;color:var(--muted)}
.rail-bottom{margin-top:auto;padding:12px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.ai-status{display:flex;align-items:center;gap:10px;width:100%;background:var(--raised);border:1px solid var(--line-strong);border-radius:var(--r-s);padding:9px 10px;text-align:left}
.ai-status:hover{background:var(--hover)}
.dot{width:8px;height:8px;border-radius:99px;flex:none;background:var(--muted)}
.dot.on{background:var(--ok);box-shadow:0 0 0 3px rgba(155,231,181,.15)}
.dot.off{background:var(--bad)}
.ai-status .t{display:flex;flex-direction:column;min-width:0}
.ai-status .t b{font-weight:500;font-size:13px}
.ai-status .t span{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.back-link{font-size:13px;color:var(--muted);text-decoration:none;padding:4px 2px}
.back-link:hover{color:#fff}

/* main */
.main{flex:1;min-width:0;display:flex;flex-direction:column;min-height:0}
.topbar{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding:16px 28px;border-bottom:1px solid var(--line)}
.topbar h1{margin:0;font-size:20px;font-weight:500;letter-spacing:-.4px}
.topbar .sub{color:var(--muted);font-size:13px}
.topbar .grow{flex:1}
.view{flex:1;min-height:0;overflow:auto;padding:24px 28px 40px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.panel-head{display:flex;align-items:center;gap:10px;justify-content:space-between;flex-wrap:wrap;padding:12px 16px;border-bottom:1px solid var(--line)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:var(--r-s);padding:9px 14px;font-weight:500;font-size:14px;border:1px solid var(--line-strong);background:var(--raised);color:var(--text);min-height:38px;white-space:nowrap}
.btn:hover{background:var(--hover)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{background:#7a58ff}
.btn.light{background:var(--text);border-color:var(--text);color:#0B0A10}
.btn.ghost{background:transparent}
.btn.danger{color:var(--bad);border-color:var(--bad-line);background:transparent}
.btn:disabled{opacity:.5;cursor:default}
.btn.sm{min-height:30px;padding:5px 10px;font-size:13px}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label{font-size:12px;color:var(--muted)}
.input,.textarea,.select{width:100%;background:var(--raised);border:1px solid var(--line-strong);border-radius:var(--r-s);padding:9px 12px;color:var(--text)}
.textarea{resize:vertical;line-height:1.6}
.input:focus,.textarea:focus,.select:focus{outline:none;border-color:var(--accent-soft)}
.note{font-size:13px;color:var(--muted)}
.msg{font-size:13px;color:var(--soft)}
.msg.err{color:var(--bad)}
.empty{padding:28px;text-align:center;color:var(--muted);font-size:14px}
.row{display:flex;gap:12px;flex-wrap:wrap}
.tag{font-family:var(--font-mono);font-size:11px;color:var(--soft);background:var(--raised);border:1px solid var(--line-strong);border-radius:6px;padding:2px 7px;white-space:nowrap}
.pill{font-family:var(--font-mono);font-size:12px;letter-spacing:.06em;border-radius:6px;padding:4px 9px;border:1px solid var(--line-strong);white-space:nowrap}
.pill.LOW,.pill.IN{color:var(--ok);background:var(--ok-wash);border-color:var(--ok-line)}
.pill.MEDIUM,.pill.RISKY{color:var(--warn);background:var(--warn-wash);border-color:var(--warn-line)}
.pill.HIGH,.pill.VERY,.pill.OUT{color:var(--bad);background:var(--bad-wash);border-color:var(--bad-line)}

/* chat */
.chat{display:flex;flex-direction:column;height:100%;min-height:0;max-width:880px;margin:0 auto}
.agents{display:flex;gap:6px;flex-wrap:wrap}
.agents button{border:1px solid var(--line-strong);background:transparent;border-radius:999px;padding:6px 12px;font-size:13px;color:var(--soft)}
.agents button[aria-pressed="true"]{background:var(--text);border-color:var(--text);color:#0B0A10}
.thread{flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column;gap:18px;padding:8px 2px 20px}
.m{display:flex;gap:12px;align-items:flex-start}
.m .who{flex:none;width:28px;height:28px;border-radius:8px;display:grid;place-items:center;font-family:var(--font-mono);font-size:11px;border:1px solid var(--line-strong);color:var(--muted)}
.m.assistant .who{background:var(--accent);border-color:var(--accent);color:#fff}
.m .body{min-width:0;flex:1;line-height:1.7;color:var(--text)}
.m.user .body{background:var(--raised);border:1px solid var(--line);border-radius:var(--r);padding:10px 14px}
.m .meta{font-size:12px;color:var(--muted);margin-bottom:2px}
.body p{margin:0 0 10px}.body p:last-child{margin-bottom:0}
.body ul,.body ol{margin:4px 0 10px 18px;padding:0}.body li{margin:3px 0}
.body h4{margin:12px 0 6px;font-size:15px;font-weight:600}
.body code{font-family:var(--font-mono);font-size:12.5px;background:var(--raised);border:1px solid var(--line);border-radius:5px;padding:1px 5px}
.body pre{font-family:var(--font-mono);font-size:12.5px;background:var(--raised);border:1px solid var(--line);border-radius:var(--r-s);padding:12px;overflow-x:auto;white-space:pre}
.body strong{color:#fff;font-weight:600}
.thinking{color:var(--muted)}
.starters{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:8px}
.starters button{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;color:var(--soft);line-height:1.45}
.starters button:hover{border-color:var(--line-strong);color:#fff}
.composer{border:1px solid var(--line-strong);background:var(--surface);border-radius:var(--r);padding:10px;display:flex;flex-direction:column;gap:8px}
.composer textarea{background:transparent;border:0;outline:0;resize:none;min-height:52px;max-height:200px;line-height:1.6;padding:4px 6px}
.composer .bar{display:flex;align-items:center;gap:8px;justify-content:space-between;flex-wrap:wrap}

/* gdd */
.gdd{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:20px;align-items:start}
.meta-grid{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1.4fr) minmax(0,1fr) minmax(0,1fr);gap:10px;padding:16px;border-bottom:1px solid var(--line)}
.gdd-text{border:0;border-radius:0 0 var(--r) var(--r);background:transparent;min-height:440px;padding:16px;font-size:14px}
.scores{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;padding:16px}
.score{background:var(--raised);border:1px solid var(--line);border-radius:var(--r-s);padding:14px;display:flex;flex-direction:column;gap:10px}
.score .n{font-size:38px;font-weight:500;letter-spacing:-1.2px;line-height:1;font-variant-numeric:tabular-nums}
.score .n span{font-size:15px;color:var(--muted);letter-spacing:0}
.bar-track{height:4px;border-radius:99px;background:var(--line)}
.bar-fill{height:4px;border-radius:99px}
.rc-block{padding:14px 16px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.rc-list{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:7px}
.rc-list li{display:flex;gap:10px;align-items:flex-start;color:var(--soft)}
.rc-list li::before{content:"";flex:none;width:6px;height:6px;border-radius:99px;margin-top:8px;background:var(--b,var(--muted))}

/* board */
.board-summary{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 16px;min-width:150px;flex:1}
.stat b{display:block;font-size:22px;font-weight:500;letter-spacing:-.5px;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted)}
.board{display:grid;grid-template-columns:repeat(4,minmax(220px,1fr));gap:12px;overflow-x:auto;padding-bottom:6px}
.col{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);display:flex;flex-direction:column;min-width:0}
.col-head{display:flex;align-items:center;justify-content:space-between;padding:10px 12px;border-bottom:1px solid var(--line)}
.col-body{padding:10px;display:flex;flex-direction:column;gap:8px;min-height:80px}
.card{background:var(--raised);border:1px solid var(--line);border-radius:var(--r-s);padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.card .title{font-weight:500;line-height:1.4;overflow-wrap:anywhere}
.card .foot{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.card .acts{margin-left:auto;display:flex;gap:4px}
.mini{width:28px;height:28px;display:grid;place-items:center;background:transparent;border:1px solid var(--line-strong);border-radius:6px;color:var(--soft)}
.mini:hover{background:var(--hover);color:#fff}
.add-task{display:grid;grid-template-columns:minmax(0,1fr) 90px auto;gap:8px;margin-top:16px}

/* scope */
.scope{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px;align-items:start}
.verdict{padding:18px 16px;display:flex;flex-direction:column;gap:12px}
.verdict .big{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.verdict .delay{font-size:30px;font-weight:500;letter-spacing:-1px;font-variant-numeric:tabular-nums}
.hist{display:flex;flex-direction:column}
.hist button{display:flex;align-items:center;gap:10px;justify-content:space-between;text-align:left;background:transparent;border:0;border-top:1px solid var(--line);padding:11px 16px;color:var(--soft)}
.hist button:hover{background:var(--hover);color:#fff}

/* decisions */
.dec{max-width:880px}
.dec-item{display:flex;gap:14px;padding:14px 16px;border-top:1px solid var(--line);align-items:flex-start}
.dec-item:first-child{border-top:0}
.dec-item .d-main{flex:1;min-width:0}
.dec-item .d-text{font-weight:500;overflow-wrap:anywhere}
.dec-item .d-why{color:var(--muted);margin-top:3px;overflow-wrap:anywhere}
.dec-item .d-meta{font-family:var(--font-mono);font-size:11px;color:var(--muted);margin-top:6px}

/* overview */
.ov{display:flex;flex-direction:column;gap:20px;max-width:1080px}
.ov-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.ov-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:8px;min-width:0}
.ov-card .k{font-size:12px;color:var(--muted)}
.ov-card .v{font-size:28px;font-weight:500;letter-spacing:-.8px;line-height:1.1;font-variant-numeric:tabular-nums}
.ov-card .v small{font-size:14px;color:var(--muted);letter-spacing:0;font-weight:400}
.ov-card .s{font-size:13px;color:var(--soft)}
.ov-two{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:20px;align-items:start}
.steps{list-style:none;margin:0;padding:0}
.steps li{display:flex;align-items:center;gap:12px;padding:12px 16px;border-top:1px solid var(--line)}
.steps li:first-child{border-top:0}
.steps .ck{flex:none;width:22px;height:22px;border-radius:99px;border:1.5px solid var(--line-strong);display:grid;place-items:center;font-size:12px;font-family:var(--font-mono);color:var(--muted)}
.steps li.done .ck{background:var(--ok-wash);border-color:var(--ok-line);color:var(--ok)}
.steps li.next .ck{border-color:var(--accent-soft);color:var(--accent-soft)}
.steps .st{flex:1;min-width:0}
.steps .st b{display:block;font-weight:500}
.steps .st span{font-size:13px;color:var(--muted)}
.steps li.done .st b{color:var(--soft)}
.banner{display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:var(--accent-wash);border:1px solid #3B2F7A;border-radius:var(--r);padding:14px 16px}
.banner .bt{flex:1;min-width:220px}
.banner .bt b{display:block;font-weight:500}
.banner .bt span{font-size:13px;color:var(--soft)}
.src{font-family:var(--font-mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;border-radius:5px;padding:2px 6px;border:1px solid var(--line-strong);color:var(--muted)}
.src.ai{color:var(--accent-soft);border-color:#3B2F7A;background:var(--accent-wash)}
.nochat{background:var(--surface);border:1px solid var(--line-strong);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:10px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--text);color:#0B0A10;border-radius:10px;padding:10px 16px;font-weight:500;font-size:14px;z-index:60;box-shadow:0 10px 40px rgba(0,0,0,.5);max-width:calc(100% - 32px)}
@media (max-width:960px){.ov-grid{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.ov-two{grid-template-columns:minmax(0,1fr)}}
@media (max-width:520px){
  .ov-grid{grid-template-columns:minmax(0,1fr);gap:8px}
  .ov-card{flex-direction:row;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:2px 10px;padding:12px 14px}
  .ov-card .v{font-size:22px}
  .ov-card .s{flex-basis:100%;font-size:12px}
  .steps .st span{display:none}
}
@media (max-width:820px){
  .back-link{display:none}
  .rail-top{padding:12px 16px}
  .rail-section{padding:10px 16px 2px}
  .rail-section .label{display:none}
  .proj-row{margin-top:0}
  .ai-status{padding:7px 10px}
}

/* wizard + templates */
.tpl-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.tpl{display:flex;flex-direction:column;gap:2px;border:1px solid var(--line-strong);border-radius:var(--r-s);padding:10px 12px;cursor:pointer;background:var(--raised)}
.tpl:has(input:checked){border-color:var(--accent-soft);background:var(--accent-wash)}
.tpl input{position:absolute;opacity:0;pointer-events:none}
.tpl b{font-weight:500;font-size:14px}
.tpl span{font-size:12px;color:var(--muted)}
.wiz-two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
.hint{font-size:12px;color:var(--muted)}
.tpl-chips{display:flex;flex-wrap:wrap;gap:6px;padding:12px 16px 0}
.tpl-chips button{border:1px solid var(--line-strong);background:var(--raised);border-radius:999px;padding:5px 11px;font-size:13px;color:var(--soft)}
.tpl-chips button:hover{color:#fff;border-color:var(--accent-soft)}
.check{display:flex;gap:10px;align-items:flex-start;font-size:13px;color:var(--soft)}
.check input{margin-top:3px;accent-color:var(--accent)}
.status{font-family:var(--font-mono);font-size:11px;letter-spacing:.06em;border-radius:6px;padding:3px 8px;border:1px solid;white-space:nowrap;display:inline-block}
.status.ok{color:var(--ok);background:var(--ok-wash);border-color:var(--ok-line)}
.status.warn{color:var(--warn);background:var(--warn-wash);border-color:var(--warn-line)}
.status.bad{color:var(--bad);background:var(--bad-wash);border-color:var(--bad-line)}
.shift{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-variant-numeric:tabular-nums}
.shift .arrow{color:var(--muted)}
@media (max-width:520px){.wiz-two{grid-template-columns:minmax(0,1fr)}.tpl{padding:9px 10px}.tpl span{display:none}.tpl b{font-size:13px}}

/* modal */
.modal{position:fixed;inset:0;background:rgba(5,4,8,.72);display:grid;place-items:center;padding:16px;z-index:50}
.sheet{width:min(560px,100%);max-height:calc(100% - 32px);overflow:auto;background:var(--surface);border:1px solid var(--line-strong);border-radius:16px}
.sheet-head{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--line)}
.sheet-head h2{margin:0;font-size:17px;font-weight:500}
.sheet-body{padding:20px;display:flex;flex-direction:column;gap:16px}
.choice{display:flex;gap:12px;align-items:flex-start;border:1px solid var(--line-strong);border-radius:var(--r);padding:12px 14px;cursor:pointer}
.choice:has(input:checked){border-color:var(--accent-soft);background:var(--accent-wash)}
.choice input{margin-top:3px;accent-color:var(--accent)}
.choice b{font-weight:500}
.choice .note{display:block;margin-top:2px}
.confirm{display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:var(--bad-wash);border:1px solid var(--bad-line);border-radius:var(--r-s);padding:10px 12px}

@media (max-width:960px){
  .gdd,.scope{grid-template-columns:minmax(0,1fr)}
  .meta-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:820px){
  html,body{height:auto}

<script>
(function () {
'use strict';

/* ---------- constants ---------- */
var GROQ_URL = 'https://api.groq.com/openai/v1/chat/completions';
var MODELS = [
  { id: 'openai/gpt-oss-120b', label: 'GPT-OSS 120B (best answers)' },
  { id: 'openai/gpt-oss-20b', label: 'GPT-OSS 20B (faster)' }
];
var STORE_KEY = 'veta-demo-v1';
var KEY_KEY = 'veta-groq-key';
var SITE = window.VETA_SITE || 'https://claude.ai/artifact/Aoei7coefUgPxtVHv7Uh53';
var COLS = [
  { id: 'backlog', name: 'Post-launch' },
  { id: 'todo', name: 'To do' },
  { id: 'doing', name: 'In progress' },
  { id: 'done', name: 'Done' }
];
var AGENTS = [
  { id: 'producer', name: 'Producer', role: 'the producer. You care most about scope, schedule and actually shipping' },
  { id: 'designer', name: 'Designer', role: 'the game designer. You care most about the core loop, player experience and what makes it fun' },
  { id: 'tech', name: 'Tech lead', role: 'the technical lead. You care most about architecture, engine choices, technical risk and realistic estimates' },
  { id: 'marketing', name: 'Marketing', role: 'the marketing lead. You care most about the Steam page, wishlists, trailers and positioning' }
];
var STARTERS = [
  'What should I cut to ship faster?',
  'Is my core loop clear enough to start building?',
  'Plan my next two weeks from the task board.',
  'Write a Steam short description for this game.'
];
var VIEWS = [
  { id: 'home', name: 'Overview', icon: '<path d="M3 11 12 4l9 7"/><path d="M5 10v10h14V10"/><path d="M10 20v-6h4v6"/>' },
  { id: 'chat', name: 'Producer chat', icon: '<path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/>' },
  { id: 'gdd', name: 'GDD & report', icon: '<path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M9 13h6M9 17h6"/>' },
  { id: 'tasks', name: 'Task board', icon: '<rect x="3" y="4" width="5" height="16" rx="1"/><rect x="10" y="4" width="5" height="10" rx="1"/><rect x="17" y="4" width="4" height="13" rx="1"/>' },
  { id: 'scope', name: 'Scope Guard', icon: '<path d="M12 3 4 6v6c0 5 3.5 8 8 9 4.5-1 8-4 8-9V6z"/><path d="m9 12 2 2 4-4"/>' },
  { id: 'decisions', name: 'Decision log', icon: '<path d="M4 6h16M4 12h16M4 18h10"/>' }
];

/* ---------- utils ---------- */
function $(id) { return document.getElementById(id); }
function esc(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
function uid() { return Math.random().toString(36).slice(2, 10); }
function clamp(v, lo, hi) { return Math.min(hi, Math.max(lo, v)); }
function num(v, lo, hi, def) { var n = Number(v); return isFinite(n) ? clamp(n, lo, hi) : def; }
function half(v) { return Math.round(v * 2) / 2; }
function strs(a, max) { return (Array.isArray(a) ? a : []).map(function (x) { return String(x == null ? '' : x).trim(); }).filter(Boolean).slice(0, max); }
function fmtDate(t) { try { return new Date(t).toLocaleDateString(undefined, { day: 'numeric', month: 'short', year: 'numeric' }); } catch (e) { return ''; } }
function icon(path, size) { return '<svg width="' + (size || 16) + '" height="' + (size || 16) + '" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + path + '</svg>'; }
var I = {
  left: '<path d="m15 18-6-6 6-6"/>', right: '<path d="m9 18 6-6-6-6"/>', x: '<path d="M18 6 6 18M6 6l12 12"/>',
  plus: '<path d="M12 5v14M5 12h14"/>', spark: '<path d="M12 3v4M12 17v4M3 12h4M17 12h4M6 6l2.5 2.5M15.5 15.5 18 18M6 18l2.5-2.5M15.5 8.5 18 6"/>'
};

function md(text) {
  var src = String(text || '').replace(/\r/g, '');
  var blocks = [];
  src = src.replace(/```[a-zA-Z0-9]*\n?([\s\S]*?)```/g, function (_, code) { blocks.push(code); return '\u0000' + (blocks.length - 1) + '\u0000'; });
  var lines = esc(src).split('\n');
  var out = [], list = null, para = [];
  function inline(s) {
    return s.replace(/`([^`]+)`/g, '<code>$1</code>').replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>').replace(/(^|[^*])\*([^*\s][^*]*)\*/g, '$1<em>$2</em>');
  }
  function flushPara() { if (para.length) { out.push('<p>' + inline(para.join('<br>')) + '</p>'); para = []; } }
  function flushList() { if (list) { out.push('<' + list.t + '>' + list.items.map(function (i) { return '<li>' + inline(i) + '</li>'; }).join('') + '</' + list.t + '>'); list = null; } }
  lines.forEach(function (line) {
    var m;
    if (/^\u0000\d+\u0000$/.test(line.trim())) { flushPara(); flushList(); var i = +line.trim().replace(/\u0000/g, ''); out.push('<pre>' + esc(blocks[i]) + '</pre>'); return; }
    if ((m = line.match(/^\s*[-*•]\s+(.*)$/))) { flushPara(); if (!list || list.t !== 'ul') { flushList(); list = { t: 'ul', items: [] }; } list.items.push(m[1]); return; }
    if ((m = line.match(/^\s*\d+[.)]\s+(.*)$/))) { flushPara(); if (!list || list.t !== 'ol') { flushList(); list = { t: 'ol', items: [] }; } list.items.push(m[1]); return; }
    if ((m = line.match(/^\s*#{1,6}\s+(.*)$/))) { flushPara(); flushList(); out.push('<h4>' + inline(m[1]) + '</h4>'); return; }
    if (!line.trim()) { flushPara(); flushList(); return; }
    flushList(); para.push(line);
  });
  flushPara(); flushList();
  return out.join('');
}

function parseJson(t) {
  if (t && typeof t === 'object') return t;
  t = String(t || '');
  try { return JSON.parse(t); } catch (e) {}
  var f = t.match(/```(?:json)?\s*([\s\S]*?)```/);
  if (f) { try { return JSON.parse(f[1]); } catch (e) {} }
  var a = t.indexOf('{'), b = t.lastIndexOf('}');
  if (a >= 0 && b > a) { try { return JSON.parse(t.slice(a, b + 1)); } catch (e) {} }
  throw { code: 'json' };
}

/* ---------- storage ---------- */
function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
function lsDel(k) { try { localStorage.removeItem(k); } catch (e) {} }

function exampleProject() {
  var now = Date.now();
  return {
    id: uid(), example: true, name: 'Ember Hollow', genre: 'Co-op roguelike', team: 2, months: 12, release: plusMonths(12),
    gdd: [
      'Pitch',
      'A 2-4 player online co-op roguelike. Players descend through a burning forest, rescuing lost spirits before the fire spreads.',
      '',
      'Core loop',
      'Enter a run, clear 6-8 rooms of enemies, rescue spirits to earn embers, spend embers on permanent upgrades at the camp, start the next run.',
      '',
      'Key features',
      '- Online co-op for 2-4 players',
      '- Rooms arranged procedurally from hand-made templates',
      '- 3 playable characters with distinct abilities',
      '- Camp hub with permanent upgrades',
      '- 3 biomes, 1 boss each',
      '',
      'Art',
      'Stylized low-poly, warm fire palette.',
      '',
      'Team and timeline',
      '2 developers (1 programmer, 1 artist). 12 months to Steam Early Access.'
    ].join('\n'),
    report: {
      example: true, at: now, quality: 7, readiness: 5, riskLevel: 'HIGH',
      coreLoop: 'Run through burning rooms, rescue spirits for embers, upgrade at camp, repeat.',
      strengths: ['The core loop is short and easy to explain', 'Hand-made room templates keep procedural levels under control', 'Team and timeline are stated'],
      risks: ['Online co-op from day one is heavy for one programmer', '3 characters, 3 biomes and 3 bosses is a lot of content for one artist', 'No plan yet for how co-op scales enemy difficulty'],
      missing: ['A target length for one run', 'What the first playable build must include']
    },
    tasks: [
      { id: uid(), title: 'Movement prototype', days: 3, system: 'Core', col: 'done' },
      { id: uid(), title: 'Character 1 abilities', days: 5, system: 'Combat', col: 'doing' },
      { id: uid(), title: 'Player controller and camera', days: 4, system: 'Core', col: 'todo' },
      { id: uid(), title: 'Room template system', days: 6, system: 'Levels', col: 'todo' },
      { id: uid(), title: 'Online lobby and session', days: 10, system: 'Networking', col: 'todo' },
      { id: uid(), title: 'First enemy archetype', days: 5, system: 'Enemies', col: 'todo' },
      { id: uid(), title: 'Fishing mini-game at camp', days: 8, system: 'Camp', col: 'backlog' }
    ],
    decisions: [
      { id: uid(), at: now, source: 'Manual', text: 'Online co-op only, no local split-screen', why: 'Halves the input and camera work for a single programmer.' },
      { id: uid(), at: now, source: 'Scope Guard', text: 'Park the camp fishing mini-game until after Early Access', why: 'Outside the core loop and about 2 weeks of extra work.' }
    ],
    chat: [],
    checks: []
  };
}
function blankProject(name) {
  return { id: uid(), example: false, name: name || 'Untitled game', genre: '', team: 1, months: 12, release: plusMonths(12), gdd: '', report: null, tasks: [], decisions: [], chat: [], checks: [] };
}

var store = (function () {
  var raw = lsGet(STORE_KEY);
  if (raw) { try { var s = JSON.parse(raw); if (s && s.projects && s.projects.length) return s; } catch (e) {} }
  var p = exampleProject();
  return { v: 1, current: p.id, view: 'home', agent: 'producer', provider: 'auto', model: MODELS[0].id, projects: [p] };
})();
var saveTimer = null;
function save() { lsSet(STORE_KEY, JSON.stringify(store)); }
function saveSoon() { clearTimeout(saveTimer); saveTimer = setTimeout(save, 400); }
function P() { return store.projects.find(function (p) { return p.id === store.current; }) || store.projects[0]; }
store.projects.forEach(function (p) { if (!parseIso(p.release)) p.release = plusMonths(p.months || 12); });

var ui = { busy: {}, ctl: {}, msg: {}, confirm: null, scopeResult: null, scopeIdea: '' };

/* ---------- AI layer ---------- */
var claudeSample = null;
try {
  if (window.claude && window.claude.use) {
    window.claude.use('sample').then(function (s) { claudeSample = s || null; renderStatus(); }).catch(function () { claudeSample = null; });
  }
} catch (e) {}

function groqKey() { return lsGet(KEY_KEY) || ''; }
var serverAI = false; // true when this site's /api/ai proxy has a key configured
/* ---------- knowledge cards (RAG phase 1: keyword match) ---------- */
var CARDS = [];
function loadCards() {
  if (!/^https?:$/.test(location.protocol)) return;
  fetch('knowledge/cards.json', { headers: { 'Accept': 'application/json' } })
    .then(function (r) { return r.ok ? r.json() : null; })
    .then(function (j) { if (j && Array.isArray(j.cards)) CARDS = j.cards; })
    .catch(function () {});
}
function pickCards(query, extra, n) {
  var q = lowerTr(query), x = lowerTr(extra || '');
  return CARDS.map(function (c) {
    var qs = 0, xs = 0;
    (c.tags || []).forEach(function (t) { t = lowerTr(t); if (q.indexOf(t) >= 0) qs++; if (x.indexOf(t) >= 0) xs++; });
    return { c: c, score: qs * 3 + Math.min(xs, 3) };
  }).filter(function (o) { return o.score >= 3; })
    .sort(function (a, b) { return b.score - a.score; }).slice(0, n || 3).map(function (o) { return o.c; });
}
function cardsBlock(cards) {
  if (!cards.length) return '';
  return '\n\nVETA KNOWLEDGE CARDS (general production guidance from Veta. Use them only if they fit this project. They are heuristics, not statistics; never turn them into numbers. When you rely on one, you may say "Veta guidance"):\n' +
    cards.map(function (c) { return '- ' + c.title + ': ' + c.summary + ' Advice: ' + (c.guidance || []).join(' '); }).join('\n');
}

function checkServerAI() {
  if (!/^https?:$/.test(location.protocol)) return;
  fetch('/api/ai', { method: 'GET', headers: { 'Accept': 'application/json' } })
    .then(function (r) { return r.ok ? r.json() : null; })
    .then(function (j) { if (j && j.ok) { serverAI = true; renderStatus(); if (!ui.busy.chat) renderView(); } })
    .catch(function () {});
}
function provider() {
  if (store.provider === 'groq') return groqKey() ? 'groq' : null;
  if (store.provider === 'claude') return claudeSample ? 'claude' : null;
  if (groqKey()) return 'groq';
  if (serverAI) return 'veta';
  if (claudeSample) return 'claude';
  return null;
}
function modelLabel() { var m = MODELS.find(function (x) { return x.id === store.model; }); return m ? m.id.replace('openai/', '') : store.model; }

function errText(e) {
  var c = e && e.code;
  if (c === 'cancelled') return 'Stopped.';
  if (c === 'nokey') return 'Connect an AI first. Open AI connection in the bottom left.';
  if (c === 'auth') return 'Groq rejected the API key. Check it in AI connection.';
  if (c === 'rate' || c === 'rate_limited') return provider() === 'veta' ? 'The free demo AI is busy or your hourly limit is reached. Try again later, or add your own free Groq key in AI connection.' : 'The free limit is reached for now. Wait a minute and try again.';
  if (c === 'model') return 'Groq could not use this model. Pick the other model in AI connection.';
  if (c === 'network') return provider() === 'veta' ? 'Could not reach the Veta demo AI. Check your connection and try again.' : 'Could not reach Groq. Check your connection. Inside claude.ai, Groq is blocked, so use Claude there.';
  if (c === 'json' || c === 'invalid_json') return 'The answer came back in the wrong format. Try again.';
  if (c === 'not_granted' || c === 'sampling_disabled') return 'Claude is not allowed for this page. Use a Groq key instead.';
  if (c === 'refused') return 'The AI declined this request. Try rephrasing it.';
  if (c === 'http') return (provider() === 'veta' ? 'The demo AI returned an error' : 'Groq returned an error') + (e.status ? ' (' + e.status + ')' : '') + '. Try again in a moment.';
  return 'Something went wrong. Try again.';
}

function groqFetch(body, signal) {
  var viaVeta = provider() === 'veta';
  var headers = { 'Content-Type': 'application/json' };
  if (!viaVeta) headers.Authorization = 'Bearer ' + groqKey();
  return fetch(viaVeta ? '/api/ai' : GROQ_URL, {
    method: 'POST',
    headers: headers,
    body: JSON.stringify(body), signal: signal
  }).catch(function (e) {
    if (e && e.name === 'AbortError') throw { code: 'cancelled' };
    throw { code: 'network' };
  }).then(function (res) {
    if (res.ok) return res;
    return res.json().catch(function () { return {}; }).then(function (j) {
      var msg = (j && j.error && j.error.message) || '';
      var code = res.status === 401 || res.status === 403 ? 'auth' : res.status === 429 ? 'rate' : (res.status === 404 || /model/i.test(msg)) ? 'model' : 'http';
      throw { code: code, status: res.status, message: msg };
    });
  });
}

/* messages: [{role:'system'|'user'|'assistant', content}] */
function aiChat(messages, onText, signal) {
  var pv = provider();
  if (!pv) return Promise.reject({ code: 'nokey' });
  if (pv === 'claude') {
    var sys = messages.filter(function (m) { return m.role === 'system'; }).map(function (m) { return m.content; }).join('\n\n');
    var turns = [{ role: 'user', content: sys }].concat(messages.filter(function (m) { return m.role !== 'system'; }));
    return claudeSample(turns, { cache: false, signal: signal, onText: function (u) { onText(u.text); } }).then(function (r) { return r.text; });
  }
  return groqFetch({ model: store.model, messages: messages, temperature: 0.7, max_tokens: 3000, stream: true }, signal).then(function (res) {
    if (!res.body || !res.body.getReader) {
      return res.text().then(function (t) { var full = ''; t.split('\n').forEach(function (l) { full += sseDelta(l); }); onText(full); return full; });
    }
    var reader = res.body.getReader(), dec = new TextDecoder(), buf = '', full = '';
    function pump() {
      return reader.read().then(function (r) {
        if (r.done) { if (buf) full += sseDelta(buf); onText(full); return full; }
        buf += dec.decode(r.value, { stream: true });
        var parts = buf.split('\n'); buf = parts.pop();
        var added = '';
        parts.forEach(function (l) { added += sseDelta(l); });
        if (added) { full += added; onText(full); }
        return pump();
      });
    }
    return pump().catch(function (e) { if (e && (e.name === 'AbortError' || e.code === 'cancelled')) throw { code: 'cancelled' }; throw e && e.code ? e : { code: 'network' }; });
  });
}
function sseDelta(line) {
  line = line.trim();
  if (line.indexOf('data:') !== 0) return '';
  var d = line.slice(5).trim();
  if (!d || d === '[DONE]') return '';
  try { var j = JSON.parse(d); return (j.choices && j.choices[0] && j.choices[0].delta && j.choices[0].delta.content) || ''; } catch (e) { return ''; }
}

function aiJson(prompt, signal) {
  var pv = provider();
  if (!pv) return Promise.reject({ code: 'nokey' });
  if (pv === 'claude') return claudeSample.json(prompt, { signal: signal });
  return groqFetch({
    model: store.model, temperature: 0.3, max_tokens: 4000,
    messages: [{ role: 'system', content: 'You are a precise assistant. Reply with exactly one JSON object and nothing else.' }, { role: 'user', content: prompt }]
  }, signal).then(function (res) { return res.json(); }).then(function (j) {
    var c = j && j.choices && j.choices[0] && j.choices[0].message && j.choices[0].message.content;
    return parseJson(c);
  });
}

function projectContext(p, opts) {
  opts = opts || {};
  var open = p.tasks.filter(function (t) { return t.col === 'todo' || t.col === 'doing'; });
  var parts = [
    'PROJECT: ' + p.name + (p.genre ? ' (' + p.genre + ')' : '') + '. Team: ' + (p.team || 1) + ' developer(s). Target release: ' + p.release + ' (about ' + (p.months || 12) + ' months from today: ' + isoDate(today0()) + ').',
    'GDD:\n' + (p.gdd.trim() ? p.gdd.slice(0, opts.gddMax || 6000) : '(empty, the developer has not written one yet)')
  ];
  if (!opts.noTasks) {
    parts.push('TASK BOARD: ' + p.tasks.length + ' tasks. Open: ' + (open.length ? open.slice(0, 15).map(function (t) { return t.title + ' (' + t.days + 'd, ' + t.col + ')'; }).join('; ') : 'none') + '. Parked for post-launch: ' + (p.tasks.filter(function (t) { return t.col === 'backlog'; }).map(function (t) { return t.title; }).join('; ') || 'none') + '.');
  }
  parts.push('DECISIONS ALREADY MADE:\n' + (p.decisions.length ? p.decisions.slice(0, 20).map(function (d) { return '- ' + d.text + (d.why ? ' (why: ' + d.why + ')' : ''); }).join('\n') : '(none yet)'));
  return parts.join('\n\n');
}

/* ---------- genre templates ---------- */
var TEMPLATES = [
  { id: 'platformer', name: 'Platformer', sub: 'Levels, movement, hazards',
    pitch: 'A tight 2D platformer about a lantern spirit climbing a ruined tower.', loop: 'Run and jump through a level, collect shards, reach the exit, unlock the next world.',

  if (a === 'k-remove') { lsDel(KEY_KEY); renderStatus(); renderSettings({ text: 'Key removed from this browser.' }); return; }
  if (a === 'reset') { ui.confirm = 'reset'; renderSettings(); return; }
  if (a === 'reset-no') { ui.confirm = null; renderSettings(); return; }
  if (a === 'reset-yes') { var ex = exampleProject(); store.projects = [ex]; store.current = ex.id; store.view = 'chat'; ui.confirm = null; ui.scopeResult = null; ui.scopeIdea = ''; save(); renderAll(); renderSettings({ text: 'Demo data reset.' }); return; }
});

document.addEventListener('input', function (e) {
  var t = e.target, p = P();
  if (t.id === 'p-name') { p.name = t.value; p.example = false; saveSoon(); renderProjects(); return; }
  if (t.id === 'p-genre') { p.genre = t.value; saveSoon(); return; }
  if (t.id === 'p-team') { p.team = Math.round(num(t.value, 1, 200, 1)); saveSoon(); return; }
  if (t.id === 'p-release') { var rd = parseIso(t.value); if (rd) { p.release = t.value; p.months = monthsUntil(rd); saveSoon(); } return; }
  if (t.id === 'p-gdd') { p.gdd = t.value; saveSoon(); return; }
  if (t.id === 'scope-idea') { ui.scopeIdea = t.value; return; }
});

document.addEventListener('change', function (e) {
  if (e.target.name === 'w-tpl') {
    wiz.tpl = e.target.value; var tt = tplById(wiz.tpl);
    $('w-pitch').placeholder = tt.pitch; $('w-loop').placeholder = tt.loop; $('w-feats').placeholder = tt.feats.join('\n');
    var wt = $('w-tasks'); if (wt) wt.parentNode.querySelector('span').textContent = tt.tasks.length ? 'Add the typical first-playable tasks for a ' + tt.name.toLowerCase() + ' game (' + tt.tasks.length + ' tasks)' : 'No starter tasks for this template';
    if (wt) wt.disabled = !tt.tasks.length; if (wt && !tt.tasks.length) wt.checked = false;
    return;
  }
  if (e.target.id === 'proj-select') { store.current = e.target.value; ui.confirm = null; ui.scopeResult = null; ui.scopeIdea = ''; save(); renderAll(); }
});

document.addEventListener('keydown', function (e) {
  if (e.target.id === 'chat-input' && e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); sendChat(e.target.value); }
  if (e.key === 'Escape' && !$('settings').hidden) closeSettings();
  if (e.key === 'Escape' && !$('wizard').hidden) closeWizard();
});

document.addEventListener('submit', function (e) {
  e.preventDefault();
  var p = P(), f = e.target;
  if (f.id === 'add-task') {
    var title = ($('t-title').value || '').trim(); if (!title) { $('t-title').focus(); return; }
    p.tasks.push({ id: uid(), title: title.slice(0, 140), days: Math.round(num($('t-days').value, 1, 60, 2)), system: '', col: 'todo' });
    save(); renderNav(); viewTasks(); var ti = $('t-title'); if (ti) ti.focus(); return;
  }
  if (f.id === 'dec-form') {
    var text = ($('d-text').value || '').trim(); if (!text) { $('d-text').focus(); return; }
    p.decisions.unshift({ id: uid(), at: Date.now(), source: 'Manual', text: text, why: ($('d-why').value || '').trim() });
    save(); renderNav(); viewDecisions(); return;
  }
  if (f.id === 'scope-form') { checkScope(); return; }
  if (f.id === 'wiz-form') { wizardCreate(); return; }
});

/* ---------- boot ---------- */
if (SITE) { var bl = $('back-link'); bl.href = SITE; bl.hidden = false; if (/^https?:/.test(SITE)) { bl.target = '_blank'; bl.rel = 'noopener'; } }
renderAll();
checkServerAI();
loadCards();
if (!lsGet(STORE_KEY + '-home')) { lsSet(STORE_KEY + '-home', '1'); store.view = 'home'; renderNav(); renderView(); }
save();

/* exposed for tests */
window.__veta = { pickCards: pickCards, cards: function () { return CARDS; }, forecast: forecast, buildGdd: buildGdd, TEMPLATES: TEMPLATES, md: md, parseJson: parseJson, sseDelta: sseDelta, projectContext: projectContext, quickReport: quickReport, quickScope: quickScope, quickTasks: quickTasks };
})();
</script>
